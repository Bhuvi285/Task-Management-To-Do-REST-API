app.jwt.secret=${JWT_SECRET}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.frontend-base-url=${FRONTEND_BASE_URL:}
app.security.refresh-cookie.name=${REFRESH_COOKIE_NAME:taskflow_refresh_token}
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.security.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/v1/auth}
app.security.password-reset-email.enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
app.security.password-reset-email.from=${PASSWORD_RESET_EMAIL_FROM:}
app.security.password-reset-email.reset-url=${PASSWORD_RESET_RESET_URL:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.security.oauth2.google.enabled=${GOOGLE_OAUTH2_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
app.security.oauth2.github.enabled=${GITHUB_OAUTH2_ENABLED:false}
app.security.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.security.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.security.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/github}
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production documentation is disabled unless deliberately enabled by deployment configuration.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
