spring.application.name=task-management-api
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskmanagerdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
app.jwt.issuer=task-management-api

# Local frontend origin; override with CORS_ALLOWED_ORIGINS in each deployment.
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.login-limit=${LOGIN_RATE_LIMIT:10}
app.security.login-window=${LOGIN_RATE_WINDOW:PT1M}
app.security.login-rate-limit-max-keys=${LOGIN_RATE_LIMIT_MAX_KEYS:10000}
app.security.password-reset-ip-limit=${PASSWORD_RESET_IP_LIMIT:10}
app.security.password-reset-account-limit=${PASSWORD_RESET_ACCOUNT_LIMIT:3}
app.security.password-reset-window=${PASSWORD_RESET_RATE_WINDOW:PT1H}
app.security.password-reset-rate-limit-max-keys=${PASSWORD_RESET_RATE_LIMIT_MAX_KEYS:10000}
app.security.password-reset-cooldown=${PASSWORD_RESET_COOLDOWN:PT1M}
app.security.password-reset-token-expiration=${PASSWORD_RESET_TOKEN_EXPIRATION:PT15M}

app.security.oauth2.google.enabled=${GOOGLE_OAUTH2_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
app.security.oauth2.github.enabled=${GITHUB_OAUTH2_ENABLED:false}
app.security.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.security.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.security.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/github}

logging.level.org.springframework.security=INFO
