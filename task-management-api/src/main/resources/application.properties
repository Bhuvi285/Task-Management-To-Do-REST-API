spring.application.name=task-management-api
server.port=8080
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskmanagerdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
app.jwt.issuer=${JWT_ISSUER:task-management-api}

# Local frontend origin; override with CORS_ALLOWED_ORIGINS in each deployment.
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.security.refresh-cookie.name=${REFRESH_COOKIE_NAME:taskflow_refresh_token}
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.security.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/v1/auth}
app.security.login-limit=${LOGIN_RATE_LIMIT:10}
app.security.login-window=${LOGIN_RATE_WINDOW:PT1M}
app.security.login-rate-limit-max-keys=${LOGIN_RATE_LIMIT_MAX_KEYS:10000}
app.security.password-reset-ip-limit=${PASSWORD_RESET_IP_LIMIT:10}
app.security.password-reset-account-limit=${PASSWORD_RESET_ACCOUNT_LIMIT:3}
app.security.password-reset-window=${PASSWORD_RESET_RATE_WINDOW:PT1H}
app.security.password-reset-rate-limit-max-keys=${PASSWORD_RESET_RATE_LIMIT_MAX_KEYS:10000}
app.security.password-reset-cooldown=${PASSWORD_RESET_COOLDOWN:PT1M}
app.security.password-reset-token-expiration=${PASSWORD_RESET_TOKEN_EXPIRATION:PT15M}
app.security.password-reset-email.enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
app.security.password-reset-email.from=${PASSWORD_RESET_EMAIL_FROM:}
app.security.password-reset-email.reset-url=${PASSWORD_RESET_RESET_URL:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.security.oauth2.google.enabled=${GOOGLE_OAUTH2_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
app.security.oauth2.github.enabled=${GITHUB_OAUTH2_ENABLED:false}
app.security.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.security.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.security.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/github}

logging.level.org.springframework.security=INFO

springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
