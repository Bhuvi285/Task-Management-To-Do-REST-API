app.jwt.secret=${JWT_SECRET}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.security.oauth2.google.enabled=${GOOGLE_OAUTH2_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.security.oauth2.github.enabled=${GITHUB_OAUTH2_ENABLED:false}
app.security.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.security.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.security.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
