name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: task-management-api
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: task-management-api/pom.xml

      - name: Run standard Maven test suite
        run: ./mvnw -B -ntp test

      - name: Run PostgreSQL 16 Testcontainers integration tests
        run: ./mvnw -B -ntp -DrunPostgresIntegration=true -Dtest=PostgreSqlIntegrationTest test

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: task-management-api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14